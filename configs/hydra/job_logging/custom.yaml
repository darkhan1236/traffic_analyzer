# Custom job logging configuration used by app_config.yaml.
version: 1
formatters:
  simple:
    format: '[%(asctime)s] [%(name)s] [%(levelname)s] %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout
root:
  handlers: [console]
  level: INFO

disable_existing_loggers: false
